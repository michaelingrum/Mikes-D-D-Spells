<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1a17" />
      <stop offset="50%" stop-color="#0e0d0c" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a3" />
      <stop offset="35%" stop-color="#c5a059" />
      <stop offset="70%" stop-color="#dfc384" />
      <stop offset="100%" stop-color="#9a762c" />
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="100%" stop-color="#8b0000" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6" />
  <rect x="28" y="28" width="456" height="456" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Arcane Circle Decor -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.35" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.25" />

  <!-- Spellbook Tome Shape -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Book Back / Pages -->
    <path d="M-100,-70 C-50,-85 -20,-75 0,-60 C20,-75 50,-85 100,-70 L100,75 C50,60 20,70 0,85 C-20,70 -50,60 -100,75 Z" fill="#141414" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Spine Center Line -->
    <path d="M0,-60 L0,85" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Page Crease Accents -->
    <path d="M-90,-60 C-45,-75 -15,-65 -5,-55" fill="none" stroke="#dfc384" stroke-width="2" opacity="0.5" />
    <path d="M90,-60 C45,-75 15,-65 5,-55" fill="none" stroke="#dfc384" stroke-width="2" opacity="0.5" />

    <!-- Left Page Runes / Lines -->
    <line x1="-80" y1="-30" x2="-25" y2="-30" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="-80" y1="-10" x2="-35" y2="-10" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="-80" y1="10" x2="-20" y2="10" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <line x1="-80" y1="30" x2="-40" y2="30" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7" />

    <!-- Right Page Magic Star Motif -->
    <g transform="translate(50, 0)">
      <!-- 8-pointed star -->
      <path d="M0,-35 L8,-12 L32,-12 L12,4 L20,28 L0,12 L-20,28 L-12,4 L-32,-12 L-8,-12 Z" fill="url(#goldGrad)" filter="url(#glow)" />
      <!-- Center Ruby Gem -->
      <circle cx="0" cy="0" r="7" fill="url(#rubyGrad)" stroke="#f5e0a3" stroke-width="1.5" />
    </g>

    <!-- Bookmark Ribbon Hanging Down -->
    <path d="M0,80 L-10,130 L0,120 L10,130 L0,80" fill="url(#rubyGrad)" stroke="url(#goldGrad)" stroke-width="2" />
  </g>
</svg>
